[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
extend-select = [
    "E402",   # module-level import order (examples/scripts insert sys.path)
    "I",      # import sorting
    "UP",     # pyupgrade
    "B",      # bugbear
    "SIM",    # simplify
    "RUF",    # ruff-specific
]
extend-ignore = [
    "BLE001",  # broad `except Exception` is deliberate in harness/agent code
    "S110",    # try/except/pass cleanup is intentional in close() paths
    "SIM105",  # same
]

[tool.ruff.lint.per-file-ignores]
# scripts have no package context; E402 is expected after a sys.path insert
"scripts/*.py" = ["E402"]
"examples/*.py" = ["E402"]
"tests/*.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"